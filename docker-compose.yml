services:
  server:
    build: ./server
    environment:
      TODO_PORT: "8080"
      TODO_DB_PATH: /data/todolist.db
    volumes:
      - todolist-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_USE_API: "true"
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  todolist-data:
